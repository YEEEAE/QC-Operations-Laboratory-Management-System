                    - strong [ref=e533]: Reject quantity, top items/reasons/departments and daily trend
                    - generic [ref=e534]: "The reject analytics read model aggregates the whole register with no actor-scope predicate, and /reject-reports is declared an authenticated route rather than a permission-bound one, so a global reject aggregate placed on a scope-aware dashboard would be an unauthorized aggregate: no rejected quantity or trend is estimated here. Owner: 017-B with 013/014 to define the read scope."
                  - listitem [ref=e535]:
                    - strong [ref=e536]: Quality record summary
                    - generic [ref=e537]: "The quality registers support a state filter only — no ownership filter exists server-side — so a quality count could not be reproduced by the link it would carry. Owner: 017-B."
