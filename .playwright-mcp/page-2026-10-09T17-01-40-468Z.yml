                    - strong [ref=e530]: Blocked reasons
                    - generic [ref=e531]: "Blocked work is readable (held tasks and HOLD receiving items each have their own counter, and \"My work today\" groups them as blocked), but no register stores a blocked reason as a field: a task records its reason in the immutable audit trail at the transition. A queue column of blocked reasons therefore cannot be read, and none is inferred. Owner: 013/026 if a reason column is approved."
