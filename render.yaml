services:
  # Production, staging, and pilot are separate service profiles. Non-production
  # services have dedicated database/storage aliases and automatic deploy disabled.
  - type: web
    name: qc-operations-laboratory-management-system
    runtime: node
    # Astro SSR serves every file-based route under src/pages through the
    # standalone Node entrypoint; Render does not need a page allowlist.
    # `pnpm run build` ends with the build-evidence gate, which fail-closes
    # unless a fresh candidate-bound run exists; `.ci-results/` is gitignored,
    # so a clean checkout must begin one first (same contract as Verification CI).
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm verification:begin && corepack pnpm run build
    startCommand: corepack pnpm start
    autoDeployTrigger: checksPass
    domains:
      - qclevel.top
    # Keep the Render hostname reachable so the application can issue the
    # canonical-host redirect until DNS/TLS verification is complete.
    renderSubdomainPolicy: enabled
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: APP_ENVIRONMENT_PROFILE
        value: production
      - key: SERVICE_VERSION
        value: 0.1.0
      - key: DATABASE_URL
        # Canonical application connection only; provider export aliases and
        # operator/API credentials do not belong in the web-service runtime.
        sync: false
      - key: PRODUCTION_DATABASE_HOST
        sync: false
      - key: PRODUCTION_DATABASE_NAME
        sync: false
      - key: NEON_BRANCH
        value: production
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_ISSUER
        sync: false
      - key: NEON_AUTH_AUDIENCE
        sync: false
      - key: EXPLABS_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RATE_LIMIT_LOGIN_MAX
        sync: false
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: AI_FALLBACK_PROVIDER
        value: gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_BASE_URL
        sync: false
  # Isolated staging service. Database, session, and file-store credentials must
  # be provisioned specifically for staging; no production aliases are accepted.
  - type: web
    name: qc-operations-laboratory-management-system-staging
    runtime: node
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm verification:begin && corepack pnpm run build
    startCommand: corepack pnpm start
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: APP_ENVIRONMENT_PROFILE
        value: staging
      - key: SERVICE_VERSION
        value: 0.1.0
      - key: STAGING_DATABASE_URL
        sync: false
      - key: STAGING_DATABASE_HOST
        sync: false
      - key: STAGING_DATABASE_NAME
        sync: false
      - key: PRODUCTION_DATABASE_HOST
        sync: false
      - key: PRODUCTION_DATABASE_NAME
        sync: false
      - key: NEON_BRANCH
        value: staging
      - key: STAGING_NEON_AUTH_JWKS_URL
        sync: false
      - key: STAGING_NEON_AUTH_ISSUER
        sync: false
      - key: STAGING_NEON_AUTH_AUDIENCE
        sync: false
      - key: STAGING_EXPLABS_API_KEY
        sync: false
      - key: STAGING_SESSION_SECRET
        sync: false
      - key: RATE_LIMIT_LOGIN_MAX
        sync: false
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        sync: false
      - key: STAGING_R2_ENDPOINT
        sync: false
      - key: STAGING_R2_ACCESS_KEY_ID
        sync: false
      - key: STAGING_R2_SECRET_ACCESS_KEY
        sync: false
      - key: STAGING_R2_BUCKET
        sync: false
      - key: PILOT_ENABLED
        value: "false"
      - key: PILOT_SHADOW_MODE
        value: "true"
      - key: PILOT_REAL_MASTER_DATA_ENABLED
        value: "false"
  # Separate pilot service; the release path stays shadow-only and disabled.
  - type: web
    name: qc-operations-laboratory-management-system-pilot
    runtime: node
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm verification:begin && corepack pnpm run build
    startCommand: corepack pnpm start
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: APP_ENVIRONMENT_PROFILE
        value: pilot
      - key: SERVICE_VERSION
        value: 0.1.0
      - key: PILOT_DATABASE_URL
        sync: false
      - key: PILOT_DATABASE_HOST
        sync: false
      - key: PILOT_DATABASE_NAME
        sync: false
      - key: PRODUCTION_DATABASE_HOST
        sync: false
      - key: PRODUCTION_DATABASE_NAME
        sync: false
      - key: NEON_BRANCH
        value: pilot
      - key: PILOT_NEON_AUTH_JWKS_URL
        sync: false
      - key: PILOT_NEON_AUTH_ISSUER
        sync: false
      - key: PILOT_NEON_AUTH_AUDIENCE
        sync: false
      - key: PILOT_EXPLABS_API_KEY
        sync: false
      - key: PILOT_SESSION_SECRET
        sync: false
      - key: RATE_LIMIT_LOGIN_MAX
        sync: false
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        sync: false
      - key: PILOT_R2_ENDPOINT
        sync: false
      - key: PILOT_R2_ACCESS_KEY_ID
        sync: false
      - key: PILOT_R2_SECRET_ACCESS_KEY
        sync: false
      - key: PILOT_R2_BUCKET
        sync: false
      - key: PILOT_ENABLED
        value: "false"
      - key: PILOT_SHADOW_MODE
        value: "true"
      - key: PILOT_SCOPE_SITE
        sync: false
      - key: PILOT_SCOPE_DEPARTMENT
        sync: false
      - key: PILOT_SCOPE_LINE
        sync: false
      - key: PILOT_SCOPE_SHIFT
        sync: false
      - key: PILOT_REAL_MASTER_DATA_ENABLED
        value: "false"
