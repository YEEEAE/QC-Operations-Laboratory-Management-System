name: Verification CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert exact release checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Begin fresh candidate verification run
        run: pnpm verification:begin

      - name: Dependency vulnerability audit
        run: |
          mkdir -p .ci-results
          set +e
          pnpm audit --audit-level high --json > .ci-results/dependency-audit.json
          audit_status=$?
          set -e
          exit "$audit_status"

      - name: Create candidate-bound SBOM and license inventory
        run: |
          mkdir -p .ci-results
          node scripts/security/write-candidate-sbom.mjs --output .ci-results/sbom.cdx.json --licenses .ci-results/licenses.json

      - name: Format
        run: pnpm format:check

      - name: Git whitespace check
        run: git diff --check HEAD

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm test:architecture

      - name: Technical debt register contract
        run: pnpm release:tech-debt:check

      - name: Environment parity and isolation guard
        run: pnpm release:parity:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests (PostgreSQL 18 Testcontainers)
        run: pnpm test:integration

      - name: Migration tests (PostgreSQL 18)
        run: pnpm test:migrations

      - name: Concurrency tests (PostgreSQL 18)
        run: pnpm test:concurrency

      - name: Security tests
        run: pnpm test:security

      - name: Build
        run: pnpm build

      # Byte-level identity of the artifact this candidate verified, recorded
      # outside dist/ so the manifest never becomes part of the tree it
      # describes. A later stage consumes it to prove it promoted the same
      # artifact instead of a rebuild (DEP-003).
      - name: Record build-artifact manifest
        run: |
          mkdir -p .ci-results
          pnpm release:manifest -- --dir dist --write .ci-results/build-manifest.json

      - name: Attest verified release artifact provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: dist/server/entry.mjs

      - name: Attest candidate SBOM
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: dist/server/entry.mjs
          sbom-path: .ci-results/sbom.cdx.json

      - name: Create release-candidate evidence
        run: >-
          pnpm run release:identity --
          --environment ci
          --build-id "github-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          --artifact dist/server/entry.mjs

      - name: Verify release-candidate evidence
        run: >-
          pnpm run release:verify --
          --environment ci
          --build-id "github-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          --expected-git-sha "$GITHUB_SHA"
          --artifact dist/server/entry.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The runner provisions PostgreSQL 18, migrates and seeds candidate-bound
      # fixtures, starts the exact built server, and runs the authenticated
      # closure suite before tearing down the server and database.
      - name: Authenticated closure E2E with candidate-bound fixtures
        env:
          QC_MANDATORY_VERIFY_FIXTURES: 'true'
          QC_VERIFY_BASE_URL: http://127.0.0.1:4321
        run: |
          QC_VERIFY_SYSTEM_OWNER_PASSWORD="qc-verify-$(openssl rand -hex 20)" \
          QC_VERIFY_SUPERVISOR_PASSWORD="qc-verify-$(openssl rand -hex 20)" \
          QC_VERIFY_MANAGER_PASSWORD="qc-verify-$(openssl rand -hex 20)" \
          QC_VERIFY_ADMIN_PASSWORD="qc-verify-$(openssl rand -hex 20)" \
          QC_VERIFY_EMPLOYEE_PASSWORD="qc-verify-$(openssl rand -hex 20)" \
          QC_VERIFY_LEAST_PASSWORD="qc-verify-$(openssl rand -hex 20)" \
          pnpm verify:e2e:authenticated

      # Every report must carry the same source fingerprint and this run's nonce.
      # The gate also compares the build digest with the bytes still in dist/.
      - name: Verification evidence completeness
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          pnpm release:evidence:check --
          --require-release
          --fail-on-skip
          --expect unit
          --expect integration
          --expect migrations
          --expect concurrency
          --expect security
          --expect build
          --expect e2e

      # Seal only after every mandatory verification gate passes. This archive
      # includes the identity sidecar and production dependencies; the existing
      # dist tree digest deliberately excludes that sidecar and is NOT this
      # archive's digest. No provider deployment is triggered here.
      - name: Seal verified runtime artifact
        run: |
          mkdir -p .ci-results/sealed
          pnpm release:manifest -- --dir dist --verify .ci-results/build-manifest.json
          cp .ci-results/build-manifest.json .ci-results/sealed/build-manifest.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); fs.writeFileSync(".ci-results/sealed/runtime-contract.json", JSON.stringify({sourceSha:process.env.GITHUB_SHA,buildId:`github-${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`,nodeVersion:process.version,serviceVersion:p.version,startCommand:"node dist/server/entry.mjs",scope:"dist + installed dependencies + package metadata; not an OS/container image",excludedRuntimePaths:["Documents/QC_System_WI_SOP_Pack/","QC_Controlled_Forms_and_Operational_Evidence/"]},null,2)+"\n")'
          tar -czf .ci-results/sealed/runtime-artifact.tar.gz dist node_modules package.json pnpm-lock.yaml
          cd .ci-results/sealed
          sha256sum runtime-artifact.tar.gz build-manifest.json runtime-contract.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest complete verified runtime artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: |
            .ci-results/sealed/runtime-artifact.tar.gz
            .ci-results/sealed/build-manifest.json
            .ci-results/sealed/runtime-contract.json
            .ci-results/sealed/SHA256SUMS

      - name: Preserve immutable verified runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/sealed/
          if-no-files-found: error
          overwrite: false

      - name: Upload release-candidate evidence
        if: always() && hashFiles('dist/release-identity.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence
          path: dist/release-identity.json
          if-no-files-found: error

      - name: Upload machine-readable verification evidence
        if: always() && hashFiles('.ci-results/**', 'playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: verification-results-${{ github.sha }}
          path: |
            .ci-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright failure artifacts
        if: failure() && hashFiles('playwright-report/**', 'test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
