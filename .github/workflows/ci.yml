name: Verification CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert exact release checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm test:architecture

      - name: Technical debt register contract
        run: pnpm release:tech-debt:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests (PostgreSQL 18 Testcontainers)
        run: pnpm test:integration

      - name: Migration tests (PostgreSQL 18)
        run: pnpm test:migrations

      - name: Concurrency tests (PostgreSQL 18)
        run: pnpm test:concurrency

      - name: Security tests
        run: pnpm test:security

      - name: Build
        run: pnpm build

      - name: Create release-candidate evidence
        run: >-
          pnpm run release:identity --
          --environment ci
          --build-id "github-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          --artifact dist/server/entry.mjs

      - name: Verify release-candidate evidence
        run: >-
          pnpm run release:verify --
          --environment ci
          --build-id "github-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          --expected-git-sha "$GITHUB_SHA"
          --artifact dist/server/entry.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start built server for E2E
        run: |
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > "$RUNNER_TEMP/qc-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/qc-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4321/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qc-server.log"
          exit 1

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload release-candidate evidence
        if: always() && hashFiles('dist/release-identity.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence
          path: dist/release-identity.json
          if-no-files-found: error

      - name: Upload machine-readable verification evidence
        if: always() && hashFiles('.ci-results/**', 'playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: verification-results-${{ github.sha }}
          path: |
            .ci-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright failure artifacts
        if: failure() && hashFiles('playwright-report/**', 'test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
